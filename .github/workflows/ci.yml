name: CI

on:
  push:
    branches: [main, rebuild]
  pull_request:
  workflow_dispatch:

jobs:
  # The build matrix is generated from versions.matrix.toml — CI never
  # hand-maintains a target list.
  matrix:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.gen.outputs.targets }}
    steps:
      - uses: actions/checkout@v4
      - id: gen
        shell: python
        run: |
          import re, os, json
          targets = re.findall(r'^\[targets\."([^"]+)"\]', open('versions.matrix.toml', encoding='utf-8').read(), re.M)
          assert targets, 'versions.matrix.toml defined no targets'
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write('targets=' + json.dumps(targets) + '\n')

  verify:
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.matrix.outputs.targets) }}
    name: "${{ matrix.target }}"
    steps:
      - uses: actions/checkout@v4

      # Client-side asset integrity. The compile and server-boot rungs below are
      # blind to these: a missing lang key renders as raw text in a GUI and a bad
      # model/texture ref shows as a missing model — neither fails a build or a
      # dedicated-server boot. Caught two real bugs the first time it ran.
      - name: "Rung 0: asset verify"
        run: node tools/verify-assets.js

      # The repo once shipped a corrupted gradlew that silently dropped all
      # arguments. Never again.
      - uses: gradle/actions/wrapper-validation@v4

      # All three toolchains; per-target selection happens via Gradle
      # toolchains (versions.matrix.toml `java`), daemon runs on 21.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21
            25

      - uses: gradle/actions/setup-gradle@v4

      # ---- RUNG 1: COMPILE against the pinned SecurityCraft + loader ----
      - name: "Rung 1: compile"
        run: ./gradlew ":${{ matrix.target }}:build" --console=plain --stacktrace
        timeout-minutes: 40

      # ---- RUNG 2: LOAD — boot a dedicated server so the loader validates the
      # generated dependency ranges against the real artifacts and the mod
      # actually loads. We do NOT pipe `stop`: on the newest servers (26.x /
      # 1.21.11 betas) the `stop` console command throws inside vanilla command
      # handling (CommandSourceStack.getLevel() is null), so the server never
      # exits and the step hangs to its timeout. Instead, boot in the background,
      # watch the log for the vanilla "Done (Xs)! For help" marker — printed only
      # AFTER mod load completes — then tear the server down ourselves. A
      # mod-load error or range mismatch never reaches that marker, so the step
      # still fails (this is what caught the "Item id not set" bug on 1.21.2+).
      - name: "Rung 2: server boot"
        timeout-minutes: 15
        run: |
          set +e
          RUN_DIR="versions/${{ matrix.target }}/run/server"
          mkdir -p "$RUN_DIR"
          echo "eula=true" > "$RUN_DIR/eula.txt"
          ./gradlew ":${{ matrix.target }}:runServer" --console=plain > server.log 2>&1 &
          GPID=$!
          RESULT=timeout
          for i in $(seq 1 240); do
            if grep -qE 'Done \(.*\)! For help' server.log; then RESULT=ok; break; fi
            if ! kill -0 "$GPID" 2>/dev/null; then RESULT=exited; break; fi
            sleep 2
          done
          # Tear down the server + gradle daemon; never let a stray kill abort
          # the step (GitHub runs each step under `bash -e`).
          kill "$GPID" 2>/dev/null || true
          pkill -P "$GPID" 2>/dev/null || true
          pkill -f 'net.minecraft' 2>/dev/null || true
          pkill -f 'runServer' 2>/dev/null || true
          ./gradlew --stop >/dev/null 2>&1 || true
          echo "----- server.log (tail) -----"
          tail -n 40 server.log || true
          echo "----- rung 2 result: $RESULT -----"
          if [ "$RESULT" = "ok" ]; then
            echo "Server reached the Done marker: mod loaded and the server booted."
            exit 0
          fi
          echo "Server never reached the Done marker (result=$RESULT) — boot failure."
          exit 1

      # ---- RUNG 3: RUN — gametest smoke suite. Exit code = number of failed
      # required gametests (0 = pass). The cross-version smoke test (convert a
      # golem, open the GUI, assert the manual page is registered) lands with the
      # phase (b) feature port; until then gameTestServer has no tests to run and
      # would crash, so this rung is non-blocking. Flip continue-on-error off once
      # the gametest exists to make it a hard gate.
      - name: "Rung 3: gametests (non-blocking until phase b)"
        continue-on-error: true
        run: |
          mkdir -p "versions/${{ matrix.target }}/run/gameTestServer"
          echo "eula=true" > "versions/${{ matrix.target }}/run/gameTestServer/eula.txt"
          ./gradlew ":${{ matrix.target }}:runGameTestServer" --console=plain
        timeout-minutes: 10

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: "SCGuardGolem-${{ matrix.target }}"
          path: versions/${{ matrix.target }}/build/libs/*.jar
          if-no-files-found: error
