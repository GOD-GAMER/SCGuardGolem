modLoader = "javafml"
loaderVersion = "[47,)"
license = "MIT"

[[mods]]
modId = "scguardgolem"
version = "${version}"
displayName = "SecurityCraft Guard Golem"
description = '''
A SecurityCraft addon that adds a configurable Security Guard Golem with patrol routes, module-based upgrades, a 3-tab GUI, scrollable loot collection, and player allow/deny lists.
'''
authors = "SCGuardGolem Team"

[[dependencies.scguardgolem]]
modId = "forge"
mandatory = true
versionRange = "[47,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.scguardgolem]]
modId = "minecraft"
mandatory = true
versionRange = "[1.20.1,1.21)"
ordering = "NONE"
side = "BOTH"

[[dependencies.scguardgolem]]
modId = "securitycraft"
mandatory = false
versionRange = "[1.9.0,)"
ordering = "AFTER"
side = "BOTH"
