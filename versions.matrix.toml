loader_min          = "26.2.0.7-beta"    # SC 26.2 branch pin; verified on maven
loader_artifact     = "net.neoforged:neoforge:26.2.0.7-beta"
sc_version          = "1.10.2.1-beta1"
sc_min              = "1.10.2.1-beta1"
sc_max              = "1.11"
sc_curse_fileId     = 8336507
